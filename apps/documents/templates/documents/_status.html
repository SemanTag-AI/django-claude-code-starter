{% if document.status == 'approved' %}<span class="badge bg-ok-soft text-ok">Approved</span>{% elif document.status == 'rejected' %}<span class="badge bg-danger-soft text-danger">Rejected</span>{% else %}<span class="badge border border-line text-muted">Waiting</span>{% endif %}{% if document.overdue %} <span data-test="overdue-badge" data-document="{{ document.pk }}" class="badge bg-warn-soft text-warn">Overdue</span>{% endif %}
