{% load static tailwind_cli %}<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Document register{% endblock %}</title>
{# Runs before the stylesheet, so that a dark page never flashes light. The choice a
   visitor made wins. Without a choice the page follows the system. #}
<script>
  (function () {
    var stored = null;
    try { stored = window.localStorage.getItem("theme"); } catch (error) { /* storage is closed: follow the system */ }
    var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.classList.toggle("dark", dark);
  })();
</script>
{% tailwind_css %}
<script src="{% static 'theme/app.js' %}" defer></script>
