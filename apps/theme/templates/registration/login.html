<!doctype html>
<html lang="en">
<head>
  {% include "theme/_head.html" %}
</head>
<body class="flex min-h-screen items-center justify-center bg-page px-4 text-content antialiased">
  <main class="w-full max-w-sm">
    <h1 class="text-2xl font-bold tracking-tight">Document register</h1>
    <p class="mt-1 text-muted">Sign in to see the documents.</p>

    <form method="post" class="card mt-6">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {% for error in form.non_field_errors %}
      <p data-test="form-error" role="alert" class="mb-4 rounded-lg border border-danger bg-danger-soft px-3 py-2 text-sm text-danger">{{ error }}</p>
      {% endfor %}
      <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium">Name</label>
      <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" value="{{ form.username.value|default_if_none:'' }}" autocomplete="username" autofocus required class="field">
      <label for="{{ form.password.id_for_label }}" class="mt-4 block text-sm font-medium">Password</label>
      <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" autocomplete="current-password" required class="field">
      <button type="submit" class="btn mt-6 w-full">Sign in</button>
    </form>

    <div class="mt-4 w-40">{% include "theme/_theme_toggle.html" %}</div>
    {% include "theme/_footer.html" %}
  </main>
</body>
</html>
