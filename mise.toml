# One command per job. The agents and the CI call these and nothing else,
# so a change of tool happens here and nowhere else.

[tools]
uv = "0.11.19"
gitleaks = "8.30.1"

[tasks.install]
description = "Install the dependencies and the git hooks"
run = ["uv sync", "uv run pre-commit install"]

[tasks.check]
description = "Run the framework's own checks and fail on a model change without a migration"
run = ["uv run python manage.py check", "uv run python manage.py makemigrations --check --dry-run"]

[tasks."check:deploy"]
description = "Run the framework's deployment check on the staging and the production settings"
# Stand-in values: the check reads settings, it connects to nothing.
env = { DJANGO_ENV_FILE = "/dev/null", DJANGO_SECRET_KEY = "a-stand-in-key-for-the-deployment-check-and-nothing-else", DJANGO_ALLOWED_HOSTS = "register.example.org", DJANGO_DATABASE_NAME = "register", DJANGO_DATABASE_USER = "register", DJANGO_DATABASE_PASSWORD = "stand-in", DJANGO_DATABASE_HOST = "database.example.org" }
run = [
    "uv run --group production python manage.py check --deploy --fail-level WARNING --settings=project.settings.production",
    "uv run --group production python manage.py check --deploy --fail-level WARNING --settings=project.settings.staging",
]

[tasks.css]
description = "Compile the Tailwind stylesheet (downloads the Tailwind CLI on first use, no Node needed)"
run = "uv run python manage.py tailwind build"

[tasks.dev]
description = "Run the development server with the Tailwind watcher"
run = ["uv run python manage.py migrate", "uv run python manage.py tailwind runserver"]

[tasks.demo]
description = "Fill an empty register with two demo users and a dozen documents"
run = ["uv run python manage.py migrate", "uv run python manage.py seed_demo"]

[tasks.test]
description = "Run every scenario that needs no browser"
run = "uv run pytest"

[tasks."test:e2e"]
description = "Run the scenarios that drive a real browser (downloads Chromium on first use)"
depends = ["css"]
run = ["uv run playwright install chromium", "uv run pytest -m e2e"]

[tasks.fingerprint]
description = "Print a fingerprint of every protected file, tracked or new, to compare before and after a change"
# The same list as "Protected files" in CLAUDE.md. Output only, nothing is written.
run = """git ls-files --cached --others --exclude-standard -- '*tests/*' '*conftest.py' pyproject.toml mise.toml project/settings/test.py .pre-commit-config.yaml .github .claude \
  | sort | while read -r file; do printf '%s %s\n' "$(git hash-object "$file")" "$file"; done"""

[tasks.lint]
description = "Check formatting and lint rules without changing files"
run = ["uv run ruff format --check .", "uv run ruff check ."]

[tasks.secrets]
description = "Scan every commit for credentials"
# A scan of nothing would pass. Refuse to call an empty history clean.
run = ["test \"$(git rev-list --count HEAD)\" -gt 0", "gitleaks git --no-banner --redact"]

[tasks."docker:build"]
description = "Make the container image of the register"
run = "docker build --tag django-claude-code-starter:local ."

[tasks."docker:up"]
description = "Run the register and its database in containers, on http://localhost:8080"
run = "docker compose up --build --detach --wait"

[tasks."docker:down"]
description = "Stop the containers and keep the data"
run = "docker compose down"
